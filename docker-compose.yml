name: trading-bot

services:
  trading-bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "10000"
      PAPER_STATE_DIR: /app/paper_state
      PAPER_REPORT_DIR: /app/reports
    volumes:
      - ./paper_state:/app/paper_state
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - web
      - app-data
      - trading

networks:
  web:
    external: true
  app-data:
    external: true
  trading:
    name: trading
